spring.application.name=vet-backend

# ---- IA (Gemini) ----
# Defina GEMINI_API_KEY no ambiente. Sem a chave, o resto da API funciona normalmente,
# só a rota /api/ia retorna erro.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# ---- Banco de dados (H2 em memória) ----
# Os dados são recriados a cada inicialização a partir do import.sql.
spring.datasource.url=jdbc:h2:mem:vetdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Console do banco: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:vetdb, usuário: sa)
spring.h2.console.enabled=true

# ---- Para usar MySQL no lugar do H2 ----
# 1) adicione a dependência com.mysql:mysql-connector-j no pom.xml
# 2) troque as linhas do datasource acima por:
# spring.datasource.url=jdbc:mysql://localhost:3306/vet_database?createDatabaseIfNotExist=true
